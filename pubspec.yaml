name: gloomhaven_enhancement_calc
description: Character sheet and enhancement calculator

version: 4.6.1+323

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.4
  auto_size_text: ^3.0.0
  sqflite: ^2.3.3
  path_provider: ^2.1.1
  provider: ^6.1.1
  flutter_svg: ^2.2.3
  # file_selector (document picker only) instead of file_picker: file_picker
  # bundles DKImagePickerController under SPM with no opt-out, dragging in
  # camera/photo/location/motion APIs that fail App Store validation (90683).
  # The app only opens .json/.txt backups (restore); backup export uses the
  # share sheet (share_plus), so no save-dialog package is needed.
  file_selector: ^1.0.0
  intl: any
  smooth_page_indicator: ^2.0.1
  uuid: ^4.5.3
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  url_launcher: ^6.2.1
  faker: ^2.2.0
  syncfusion_flutter_sliders: ^33.2.4
  path: ^1.8.3
  font_awesome_flutter: ^11.0.0
  material_design_icons_flutter: ^7.0.7296
  share_plus: ^13.3.0
  collection: ^1.19.0

  cupertino_icons: ^1.0.8
  confetti: 0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  # In-memory SQLite for backup/restore service tests (no platform plugin needed)
  sqflite_common_ffi: ^2.3.3

flutter_launcher_icons: # dart run flutter_launcher_icons
  android: true
  ios: true
  image_path: "icons/launcher_icon.png"
  image_path_android: "icons/android/launcher_icon.png"
  adaptive_icon_background: "#262626"
  adaptive_icon_foreground: "icons/android/foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    # - icons/
    # - icons/android/
    - images/attack_modifiers/
    - images/class_icons/
    - images/elements/
    - images/equipment_slots/
    - images/pips/
    - images/titles/
    - images/resources/
    - images/status_effects/
    - images/actions/
    - images/card_mechanics/
    - images/class_abilities/
    - images/ui/
    - images/branding/
    - images/scenario/

  fonts:
    - family: PirataOne
      fonts:
        - asset: fonts/pirata_one.ttf
    - family: Nyala
      fonts:
        - asset: fonts/nyala.ttf
    - family: Inter
      fonts:
        - asset: fonts/inter/Inter-Regular.ttf
