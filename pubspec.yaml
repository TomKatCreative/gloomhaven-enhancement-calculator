name: gloomhaven_enhancement_calc
description: Character sheet and enhancement calculator

version: 4.6.0+322

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.4
  auto_size_text: ^3.0.0
  sqflite: ^2.3.3
  path_provider: ^2.1.1
  provider: ^6.1.1
  flutter_svg: ^2.2.3
  # Pinned at 10.3.10: file_picker 11.0.2's Android plugin skips applying the
  # Kotlin plugin when AGP 9 is detected (relies on a propagation that doesn't
  # happen), causing GeneratedPluginRegistrant to fail with "cannot find
  # symbol FilePickerPlugin" at compile time. Revisit when 11.0.3+ ships.
  file_picker: 10.3.10
  intl: any
  smooth_page_indicator: ^2.0.1
  uuid: ^4.5.3
  # *_plus 10.x/13.x require win32 ^6 which conflicts with file_picker 11
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  url_launcher: ^6.2.1
  faker: ^2.2.0
  syncfusion_flutter_sliders: ^33.2.4
  path: ^1.8.3
  font_awesome_flutter: ^11.0.0
  material_design_icons_flutter: ^7.0.7296
  share_plus: ^12.0.2
  collection: ^1.19.0

  cupertino_icons: ^1.0.8
  confetti: 0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  # In-memory SQLite for backup/restore service tests (no platform plugin needed)
  sqflite_common_ffi: ^2.3.3

flutter_launcher_icons: # dart run flutter_launcher_icons
  android: true
  ios: true
  image_path: "icons/launcher_icon.png"
  image_path_android: "icons/android/launcher_icon.png"
  adaptive_icon_background: "#262626"
  adaptive_icon_foreground: "icons/android/foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    # - icons/
    # - icons/android/
    - images/attack_modifiers/
    - images/class_icons/
    - images/elements/
    - images/equipment_slots/
    - images/pips/
    - images/titles/
    - images/resources/
    - images/status_effects/
    - images/actions/
    - images/card_mechanics/
    - images/class_abilities/
    - images/ui/
    - images/branding/
    - images/scenario/

  fonts:
    - family: PirataOne
      fonts:
        - asset: fonts/pirata_one.ttf
    - family: Nyala
      fonts:
        - asset: fonts/nyala.ttf
    - family: Inter
      fonts:
        - asset: fonts/inter/Inter-Regular.ttf
