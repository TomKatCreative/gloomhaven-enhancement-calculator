name: Deploy to Internal Track

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 4.3.3) - leave empty to use pubspec.yaml'
        required: false
        type: string

env:
  FLUTTER_VERSION: "3.47.7"
  JAVA_VERSION: "21"
  BUILD_NUMBER_OFFSET: 370  # After repo transfer: run 1 + 370 = 371 (previous max was 368)

jobs:
  deploy:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Fails if pubspec.lock is out of date, so the build uses exactly the
      # dependency versions that were tested locally.
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      # Gate the deploy on the full suite, including the migration and backup
      # harness (docs/database_migration_testing.md). Runs before any secrets
      # are written to disk.
      - name: Run tests
        run: flutter test

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          echo "storeFile=keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties

      - name: Calculate build number
        id: build_number
        run: echo "value=$(( ${{ github.run_number }} + ${{ env.BUILD_NUMBER_OFFSET }} ))" >> $GITHUB_OUTPUT

      - name: Build App Bundle
        run: |
          BUILD_ARGS="--release --build-number=${{ steps.build_number.outputs.value }}"
          if [ -n "${{ inputs.version_name }}" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-name=${{ inputs.version_name }}"
          fi
          flutter build appbundle $BUILD_ARGS

      - name: Decode service account
        run: echo "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}" | base64 --decode > service-account.json

      - name: Upload to Play Store (Internal Track)
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJson: service-account.json
          packageName: tomkatcreative.gloomhavenenhancementcalc
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
